<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marble Puzzles</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/ttgame.css?v=4">
  <link rel="stylesheet" href="css/journey.css?v=8">
</head>
<body>
  <main>
    <h1 id="puzzle-name"></h1>
    <p id="goal"></p>

    <div class="play-area">
      <div id="board" aria-label="Puzzle board"><p id="loading">Loading…</p></div>

      <aside id="panel">
        <h2>Your parts</h2>
        <p id="tray-count"></p>
        <div id="tray">
          <button class="tray-item" data-kind="ramp" data-lean="left" aria-label="Ramp that rolls marbles left"><span class="icon"></span><span class="count"></span></button>
          <button class="tray-item" data-kind="ramp" data-lean="right" aria-label="Ramp that rolls marbles right"><span class="icon"></span><span class="count"></span></button>
          <button class="tray-item" data-kind="crossover" data-lean="none" aria-label="Crossover: marbles pass straight across it"><span class="icon"></span><span class="count"></span></button>
        </div>
        <p class="hint">Drag a part onto the board. Tap a ramp you placed to flip it. Drag a part you placed off the board to take it away.</p>

        <div id="controls">
          <button id="start"><span class="dot"></span><span class="label">Start</span></button>
          <button id="reset">Reset marbles</button>
        </div>
        <p id="result" role="status"></p>
        <p id="tally"></p>
      </aside>
    </div>
  </main>

  <footer>
    Puzzles from the <a href="https://upperstory.com/turingtumble/assets/practice-guide-2021.pdf">Turing Tumble Practice Guide</a> by UpperStory.
    Board, parts and marble physics are <a href="https://github.com/jessecrossen/ttsim">ttsim</a> by Jesse Crossen, running unmodified.
    Non-commercial.
  </footer>

  <script src="data/puzzles.js?v=23"></script>
  <script src="data/journey.js?v=4"></script>
  <script src="js/journey-core.js?v=6"></script>
  <!-- ttsim's own built files, copied unchanged from its docs/ folder -->
  <script src="vendor/ttsim/system.js"></script>
  <script src="vendor/ttsim/app.js"></script>
  <script src="js/ttgame.js?v=9"></script>
</body>
</html>
